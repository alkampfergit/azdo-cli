name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to publish as a preview (leave empty for a normal run)"
        required: false
        type: string

jobs:
  # Trusted gate for a manual preview run. Runs only code from the dispatched
  # ref (never the PR), validates the PR, pins its head SHA so every later job
  # builds exactly the same commit, and derives the version from tags.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Check PR is open
        id: pr
        if: inputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number: $PR"; exit 1
          fi
          state=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json state -q .state)
          if [ "$state" != "OPEN" ]; then
            echo "PR #$PR is $state, nothing to publish"; exit 1
          fi
          echo "sha=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: inputs.pr != ''
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute preview version
        id: version
        if: inputs.pr != ''
        env:
          PR: ${{ inputs.pr }}
        run: |
          out=$(bash scripts/compute-version.sh --pr "$PR" "$GITHUB_RUN_NUMBER")
          echo "$out" | grep -Eq '^version=[0-9]+\.[0-9]+\.[0-9]+-pr\.[0-9]+\.[0-9]+$'
          echo "$out" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      # No npm cache on a preview run: it executes PR code, which must not be
      # able to write a cache that later default-branch runs restore.
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: ${{ inputs.pr == '' && 'npm' || '' }}

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

      - name: Unit tests
        run: npx vitest run tests/unit --reporter=default --reporter=junit --outputFile.junit=test-results/unit.xml

      - name: Upload unit test report
        if: always()
        uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1
        with:
          name: Unit Tests
          path: test-results/unit.xml
          reporter: java-junit

  integration-tests:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: ${{ inputs.pr == '' && 'npm' || '' }}

      - run: npm ci

      - name: Integration tests
        if: env.AZDO_PAT != ''
        env:
          AZDO_PAT: ${{ secrets.AZDO_PAT }}
          AZDO_ORG: ${{ secrets.AZDO_ORG }}
          AZDO_PROJECT: ${{ secrets.AZDO_PROJECT }}
          # AZDO_PR_ID drives the PR-thread read + round-trip integration
          # tests for issue #34. Falls back to PR 64 (the spec's canonical
          # reference PR) when no repository variable is set. When
          # AZDO_REPO secret is configured alongside AZDO_PAT/ORG/PROJECT
          # the pull-requests.test.ts suite will also run end-to-end; when
          # it isn't, those tests skip cleanly via SKIP_PR.
          AZDO_PR_ID: ${{ vars.AZDO_PR_ID || '64' }}
        run: npm run build && npx vitest run tests/integration --reporter=default --reporter=junit --outputFile.junit=test-results/integration.xml

      - name: Upload integration test report
        if: always()
        uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1
        with:
          name: Integration Tests
          path: test-results/integration.xml
          reporter: java-junit

  publish:
    needs: [build, integration-tests]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run build

      - name: Set version and tag
        id: version
        run: |
          bash scripts/compute-version.sh "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER" | \
            tee -a "$GITHUB_OUTPUT"

      - name: Set package version
        if: steps.version.outputs.version != steps.version.outputs.base_version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - name: Publish to npm
        run: npm publish --tag "${{ steps.version.outputs.tag }}" --provenance --access public

  # Preview of a pull request, started by hand (workflow_dispatch with `pr`).
  # Split in two so the job holding the npm publish permission never executes
  # PR code: `package-preview` runs the PR's scripts without id-token and hands
  # over a tarball; `publish-preview` only publishes that tarball.
  package-preview:
    needs: [prepare, build, integration-tests]
    if: github.event_name == 'workflow_dispatch' && inputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # No npm cache (cache poisoning) and no lifecycle scripts: the build is
      # plain tsup, so install and pack need none of the PR's scripts.
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: npm ci --ignore-scripts

      - run: npm run build

      - name: Pack preview
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          npm pkg set version="$VERSION"
          mkdir -p preview && npm pack --ignore-scripts --pack-destination preview

      - uses: actions/upload-artifact@v4
        with:
          name: preview-tarball
          path: preview/*.tgz
          if-no-files-found: error

  publish-preview:
    needs: [prepare, package-preview]
    if: github.event_name == 'workflow_dispatch' && inputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: preview-tarball
          path: preview

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Verify tarball
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          [ "$(ls preview/*.tgz | wc -l)" = 1 ]
          [ "$(tar -xzOf preview/*.tgz package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).name')" = azdo-cli ]
          [ "$(tar -xzOf preview/*.tgz package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')" = "$VERSION" ]

      - name: Publish preview to npm
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: npm publish preview/*.tgz --registry https://registry.npmjs.org/ --tag "$TAG" --provenance --access public

      - name: Summary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          {
            echo "### Preview published: \`$VERSION\`"
            echo
            echo '```'
            echo "npm i -g azdo-cli@$TAG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: publish
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get version
        id: version
        run: |
          HEAD_TAG=$(git tag --points-at HEAD | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$' | head -n 1)
          if [ -z "$HEAD_TAG" ]; then
            echo "No version tag found on HEAD for master branch."
            exit 1
          fi
          echo "version=${HEAD_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
